<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us — CCREST.in</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: 'Inter', system_ui, sans-serif; }
    </style>
</head>
<body class="bg-white">
    <div class="bg-[#0F2744] text-white py-2 text-xs">
        <div class="max-w-screen-2xl mx-auto px-6 flex justify-between items-center">
            <span>Contact — CCREST</span>
            <a href="index.html" class="text-white/70">Home</a>
        </div>
    </div>
    
    <div class="max-w-screen-2xl mx-auto px-6 pt-8">
        <div class="max-w-xl">
            <h1 class="font-extrabold text-4xl">Get in touch</h1>
            <p class="mt-2 text-sm">Our team is here to help you with course enquiries, partnerships, or support.</p>
            
            <div class="mt-8">
                <form id="contact-form" onsubmit="submitContactForm(event)">
                    <div class="grid grid-cols-2 gap-3">
                        <div>
                            <label class="text-xs font-bold">Full Name</label>
                            <input type="text" value="Aarav Mehta" class="w-full px-4 py-2.5 border rounded-2xl text-sm mt-1">
                        </div>
                        <div>
                            <label class="text-xs font-bold">Email</label>
                            <input type="email" value="learner@demo.ccrest.in" class="w-full px-4 py-2.5 border rounded-2xl text-sm mt-1">
                        </div>
                    </div>
                    
                    <div class="mt-3">
                        <label class="text-xs font-bold">Subject</label>
                        <input type="text" value="Course enquiry" class="w-full px-4 py-2.5 border rounded-2xl text-sm mt-1">
                    </div>
                    
                    <div class="mt-3">
                        <label class="text-xs font-bold">Message</label>
                        <textarea class="w-full px-4 py-2.5 border rounded-2xl text-sm mt-1" rows="4">I would like to know more about the Clinical Trial Management course.</textarea>
                    </div>
                    
                    <div class="mt-4">
                        <button type="submit" class="px-6 py-3 px-7 text-sm bg-[#0F2744] text-white font-extrabold rounded-2xl">Send Message</button>
                    </div>
                </form>
            </div>
            
            <div class="mt-9 text-xs">
                <div class="font-bold">Other ways to reach us</div>
                <div class="mt-3 flex gap-x-8">
                    <div>
                        <div class="font-bold">Email</div>
                        <div class="text-xs">hello@ccrest.in</div>
                    </div>
                    <div>
                        <div class="font-bold">Phone</div>
                        <div class="text-xs">+91 98765 43210</div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        function submitContactForm(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const original = btn.innerHTML;
            btn.innerHTML = 'Sending...';
            
            setTimeout(() => {
                btn.innerHTML = 'Message sent!';
                setTimeout(() => {
                    btn.closest('form').reset();
                    btn.innerHTML = original;
                    const msg = document.createElement('div');
                    msg.style.cssText = 'position:fixed;bottom:20px;left:50%;transform:translate(-50%,0);background:#166534;color:white;padding:7px 16px;border-radius:9999px;font-size:0.7rem';
                    msg.innerHTML = 'Thank you! We will respond within 24 hours.';
                    document.body.appendChild(msg);
                    setTimeout(() => msg.remove(), 3000);
                }, 1200);
            }, 1400);
        }
    </script>
</body>
</html>
