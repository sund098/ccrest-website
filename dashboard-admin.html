<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CCREST Admin Dashboard</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            color: #142c4c;
            padding: 30px;
        }

        .container {
            max-width: 1200px;
            margin: auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
            gap: 15px;
        }

        header h1 {
            color: #142c4c;
        }

        .card {
            background: white;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.05);
            margin-bottom: 25px;
        }

        h2 {
            margin-bottom: 20px;
        }

        form {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
        }

        input, select, textarea {
            padding: 12px;
            width: 100%;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
        }

        textarea {
            grid-column: span 2;
            resize: vertical;
        }

        button {
            background: #142c4c;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        button:hover {
            background: #254b75;
        }

        form button {
            grid-column: span 2;
        }

        .course-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
        }

        .course {
            border: 1px solid #eee;
            border-radius: 10px;
            padding: 20px;
            background: #fff;
        }

        .course h3 {
            margin-bottom: 10px;
        }

        .course p {
            margin: 8px 0;
            color: #555;
        }

        .price {
            color: #0b8564;
            font-weight: bold;
            font-size: 20px;
        }

        #message {
            margin-bottom: 15px;
            font-weight: bold;
        }

        @media(max-width: 600px) {
            form {
                grid-template-columns: 1fr;
            }

            textarea, form button {
                grid-column: span 1;
            }

            body {
                padding: 15px;
            }
        }
    </style>
</head>

<body>

<div class="container">

   <header>
    <h1>CCREST Admin Dashboard</h1>

    <div style="display: flex; gap: 10px;">
        <button onclick="loadCourses()">Refresh Courses</button>

        <button onclick="window.location.href='admin-enrollments.html'">
            Enrollment Dashboard
        </button>
    </div>
</header>

    <!-- Add Course -->
    <section class="card">
        <h2>Add New Course</h2>

        <div id="message"></div>

        <form id="courseForm" novalidate>

            <input
                type="text"
                id="title"
                placeholder="Course Title"
                required
            >

            <input
                type="number"
                id="price"
                placeholder="Course Price"
                required
            >

            <select id="level">
                <option value="Beginner">Beginner</option>
                <option value="Intermediate">Intermediate</option>
                <option value="Advanced">Advanced</option>
            </select>

            <input
                type="text"
                id="instructor"
                placeholder="Instructor Name"
            >

            <textarea
                id="description"
                placeholder="Course Description"
                rows="4"
            ></textarea>

            <button type="submit">Add Course</button>

        </form>
    </section>

    <!-- Course List -->
    <section class="card">
        <h2>Available Courses</h2>
        <input
    type="text"
    id="searchCourse"
    placeholder="Search courses by title, instructor or level..."
    style="width: 100%; padding: 12px; margin-bottom: 20px;"
>

        <div id="courseList" class="course-grid">
            <p>Loading courses...</p>
        </div>
    </section>

</div>

<script>

    const API_URL = "https://ccrest-website.onrender.com/api/courses";
    let editingCourseId = null;

    // GET courses from backend
    async function loadCourses() {

        const courseList = document.getElementById("courseList");

        try {

            const response = await fetch(API_URL);

            if (!response.ok) {
                throw new Error("Failed to fetch courses");
            }

            const courses = await response.json();

            const searchTerm = document.getElementById("searchCourse").value.trim().toLowerCase();

const filteredCourses = courses.filter(course =>
    (course.title || "").toLowerCase().includes(searchTerm) ||
    (course.instructor || "").toLowerCase().includes(searchTerm) ||
    (course.level || "").toLowerCase().includes(searchTerm)
);

            courseList.innerHTML = "";

           if (filteredCourses.length === 0) {
    courseList.innerHTML = "<p>No courses found.</p>";
    return;
}

          filteredCourses.forEach(course => {

                const courseCard = document.createElement("div");

                courseCard.className = "course";

               courseCard.innerHTML = `
    <h3>${escapeHTML(course.title || "Untitled Course")}</h3>

    <p class="price">
        ₹${Number(course.price || 0).toLocaleString("en-IN")}
    </p>

    <p><strong>Level:</strong> ${escapeHTML(course.level || "Beginner")}</p>

    <p><strong>Instructor:</strong> ${escapeHTML(course.instructor || "Not specified")}</p>

    <p>${escapeHTML(course.description || "No description available")}</p>

    <div style="margin-top:15px; display:flex; gap:10px;">
        <button onclick="editCourse('${course._id}')">Edit</button>
        <button onclick="deleteCourse('${course._id}')"
                style="background:#dc3545;">Delete</button>
    </div>
`;

                courseList.appendChild(courseCard);

            });

        } catch (error) {

            courseList.innerHTML =
                "<p>Unable to load courses. Check backend server.</p>";

            console.error(error);

        }
    }


    document.getElementById("searchCourse").addEventListener("input", loadCourses);

    // Add / Update course
document.getElementById("courseForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        // Form validation
const title = document.getElementById("title").value.trim();
const price = document.getElementById("price").value;
const instructor = document.getElementById("instructor").value.trim();
const description = document.getElementById("description").value.trim();

const message = document.getElementById("message");

if (!title || !price || !instructor || !description) {
    message.textContent = "Please fill in all fields.";
    message.style.color = "red";
    return;
}

if (Number(price) <= 0 || isNaN(Number(price))) {
    message.textContent = "Course price must be a valid positive number.";
    message.style.color = "red";
    return;
}

        const courseData = {
            title: document.getElementById("title").value,
            price: Number(document.getElementById("price").value),
            level: document.getElementById("level").value,
            instructor: document.getElementById("instructor").value,
            description: document.getElementById("description").value
        };

        try {

            let response;

            if (editingCourseId) {

                // PUT - Update course
                response = await fetch(`${API_URL}/${editingCourseId}`, {
                    method: "PUT",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(courseData)
                });

            } else {

                // POST - Add course
                response = await fetch(API_URL, {
                    method: "POST",
                    headers: {
                        "Content-Type": "application/json"
                    },
                    body: JSON.stringify(courseData)
                });

            }

            const result = await response.json();

            if (!response.ok) {
                throw new Error(result.message || "Operation failed");
            }

            const message = document.getElementById("message");

            message.textContent = editingCourseId
                ? "Course updated successfully!"
                : "Course added successfully!";

            message.style.color = "green";

            // Reset form
            document.getElementById("courseForm").reset();
            editingCourseId = null;

            // Restore button
            document.querySelector("#courseForm button[type='submit']")
                .textContent = "Add Course";

            // Restore heading
            document.querySelector(".card h2")
                .textContent = "Add New Course";

            // Refresh course list
            loadCourses();

        } catch (error) {

            const message = document.getElementById("message");

            message.textContent = "Error: " + error.message;
            message.style.color = "red";

            console.error(error);

        }
    });

    // Edit course
async function editCourse(id) {

    try {

        const response = await fetch(API_URL);

        if (!response.ok) {
            throw new Error("Failed to fetch courses");
        }

        const courses = await response.json();

        const course = courses.find(c => c._id === id);

        if (!course) {
            alert("Course not found");
            return;
        }

        // Fill form
        document.getElementById("title").value = course.title || "";
        document.getElementById("price").value = course.price || 0;
        document.getElementById("level").value = course.level || "Beginner";
        document.getElementById("instructor").value = course.instructor || "";
        document.getElementById("description").value = course.description || "";

        // Store ID
        editingCourseId = id;

        // Change button
        document.querySelector("#courseForm button[type='submit']")
            .textContent = "Update Course";

        // Change heading
        document.querySelector(".card h2")
            .textContent = "Edit Course";

        // Display message
        const message = document.getElementById("message");

        message.textContent = "Editing selected course";
        message.style.color = "blue";

        // Scroll to form
        document.getElementById("courseForm")
            .scrollIntoView({ behavior: "smooth" });

    } catch (error) {

        console.error(error);
        alert("Unable to load course for editing");

    }
}

    // Delete course
async function deleteCourse(id) {

    const confirmDelete = confirm("Are you sure you want to delete this course?");

    if (!confirmDelete) {
        return;
    }

    try {

        const response = await fetch(`${API_URL}/${id}`, {
            method: "DELETE"
        });

        const result = await response.json();

        if (!response.ok) {
            throw new Error(result.message || "Failed to delete course");
        }

        alert("Course deleted successfully!");

        loadCourses();

    } catch (error) {

        console.error(error);
        alert("Error deleting course: " + error.message);

    }
}
   

    // Escape HTML to avoid rendering user input as markup
    function escapeHTML(value) {
        return String(value).replace(/[&<>"']/g, character => {
            const replacements = {
                "&": "&amp;",
                "<": "&lt;",
                ">": "&gt;",
                '"': "&quot;",
                "'": "&#39;"
            };
            return replacements[character];
        });
    }

    // Load courses when dashboard opens
    loadCourses();

</script>

</body>
</html>
